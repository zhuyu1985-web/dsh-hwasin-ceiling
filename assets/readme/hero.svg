<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">dsh-hwasin-ceiling</title>
  <desc id="desc">A DeepSeek Harness plugin that pins the nearest user prompt to the top of the conversation scrollport as a compact full-width bar.</desc>

  <rect width="1200" height="420" rx="28" fill="#F7F4EE"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#E3DDD2"/>

  <g id="identity" transform="translate(64 64)">
    <text x="0" y="52" fill="#1A1A1A" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif" font-size="48" font-weight="700">dsh-hwasin-ceiling</text>
    <text x="0" y="96" fill="#3167E3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650" letter-spacing="1.4">DEEPSEEK HARNESS · WEB PLUGIN</text>
    <text x="0" y="148" fill="#3F3A33" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif" font-size="24">The nearest user prompt stays</text>
    <text x="0" y="184" fill="#3F3A33" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif" font-size="24">at the top of the transcript.</text>

    <g transform="translate(0 232)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="650">
      <rect width="148" height="38" rx="19" fill="#E8EEFF"/>
      <text x="74" y="25" text-anchor="middle" fill="#3158B7">SCROLL PIN</text>
      <rect x="160" width="148" height="38" rx="19" fill="#F1EEE7"/>
      <text x="234" y="25" text-anchor="middle" fill="#5C564C">TWO LINES</text>
      <rect x="320" width="148" height="38" rx="19" fill="#EEF6F1"/>
      <text x="394" y="25" text-anchor="middle" fill="#347055">NO FLICKER</text>
    </g>
  </g>

  <g id="transcript" transform="translate(668 42)">
    <rect width="468" height="336" rx="22" fill="#FFFcf7" stroke="#E3DDD2"/>
    <rect x="18" y="16" width="432" height="28" rx="8" fill="none"/>
    <text x="28" y="36" fill="#8A8378" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15">Chat</text>
    <rect x="72" y="24" width="36" height="3" rx="1.5" fill="#3167E3"/>

    <g transform="translate(18 52)">
      <rect width="432" height="52" rx="14" fill="#E8F0EA"/>
      <text x="16" y="22" fill="#1A1A1A" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif" font-size="16">Where should this plugin live,</text>
      <text x="16" y="42" fill="#1A1A1A" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif" font-size="16">and how do I install it?</text>
    </g>

    <g transform="translate(18 118)" fill="#B7B1A6">
      <rect width="280" height="8" rx="4"/>
      <rect y="18" width="348" height="8" rx="4"/>
      <rect y="36" width="312" height="8" rx="4"/>
      <rect y="54" width="260" height="8" rx="4"/>
      <rect y="72" width="300" height="8" rx="4"/>
      <rect y="90" width="220" height="8" rx="4"/>
    </g>

    <g transform="translate(150 230)">
      <rect width="300" height="44" rx="18" fill="#E8F0EA"/>
      <text x="16" y="28" fill="#1A1A1A" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif" font-size="16">Show me the install command.</text>
    </g>

    <g transform="translate(18 288)" fill="#C8C2B7">
      <rect width="240" height="8" rx="4"/>
      <rect y="18" width="300" height="8" rx="4"/>
    </g>
  </g>
</svg>
