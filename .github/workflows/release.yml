name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, the minimum for OIDC trusted publishing
          # (npm >= 11.5.1 performs the id-token exchange inside npm publish).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      # Trusted publishing (OIDC): no npm token, auth via the id-token
      # permission above + the trusted publisher configured on npmjs.com.
      # Skips automatically when package.json's version already exists.
      - uses: JS-DevTools/npm-publish@v4
